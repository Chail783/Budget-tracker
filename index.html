
<!DOCTYPE html>
<html>
<head>
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
  <header class="top">
    <h1>Budget Tracker</h1>
    <p>Track your income and spending.</p>
  </header>

  <section class="cards">
    <div class="card income-card">
      <p class="label"><i class="bi bi-cash-stack"></i> Income</p>
      <p class="amount"><span id="total-income">0</span></p>
    </div>
    <div class="card expense-card">
    <p class="label"><i class="bi bi-cart3"></i> Expenses</p>
      <p class="amount"><span id="total-expense">0</span></p>
    </div>
    <div class="card balance-card">
      <p class="label"><i class="bi bi-wallet2"></i> Balance</p>
      <p class="amount"><span id="balance">0</span></p>
    </div>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>Add entry</h2>
      <form>
        <input type="text" id="description" placeholder="Description (e.g. Lunch)">
        <input type="number" id="amount" placeholder="Amount">
        <select id="type">
          <option>Income</option>
          <option>Expense</option>
        </select>
        <select id="category">
          <option>Food</option>
          <option>Transport</option>
          <option>Bills</option>
          <option>Education</option>
          <option>Other</option>
        </select>
        <button type="button" id="add-btn">Add</button>
      </form>
    </div>

    <div class="panel">
      <h2>Spending by category</h2>
      <div class="chart-box">
        <canvas id="category-chart"></canvas>
      </div>
    </div>
  </section>

  <section class="panel">
    <h2>Entries</h2>
    <ul id="entries"></ul>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="script.js"></script>
</body>
</html>
